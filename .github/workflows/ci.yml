# CI pipeline for the Car Rental App (React Native / Expo + TypeScript)
# Guard -> verify -> tests

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solution is not in the repo root, so run everything from here.
defaults:
  run:
    working-directory: car-rental-app

jobs:
  # ---------- guard: repo rules ----------

  agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require AGENTS.md or CLAUDE.md
        run: |
          if [ -f AGENTS.md ] || [ -f CLAUDE.md ]; then
            echo "Agent rules file found."
          else
            echo "Missing AGENTS.md or CLAUDE.md (required by course AI policy)."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets (gitleaks)
        working-directory: .   # scan the whole repo, not just the app folder
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --no-git --source /repo --redact --verbose

  # ---------- verify: static checks ----------

  static-checks:
    needs: [agent-rules, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: car-rental-app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Formatting
        run: npx prettier --check .

  # ---------- tests ----------

  unit-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: car-rental-app/package-lock.json
      - run: npm ci
      - run: npx jest --ci --coverage

  backend-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for backend
        id: backend
        working-directory: .   # backend/ would sit at the repo root
        run: |
          if [ -f backend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.backend.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install, lint and test backend
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present
          npm test
